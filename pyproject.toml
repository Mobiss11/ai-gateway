[project]
name = "ai-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway to multiple LLM providers: DeepSeek, OpenRouter, Anthropic Messages (kraube), Claude Code CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.uv]
# Одиночный модуль gateway.py запускается напрямую, пакет собирать не нужно.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"